
# Dev-grade PostgreSQL for the migrated service. Migrations off Java EE
# monoliths land on a real datasource (Flyway schema + seed data), so the
# runtime environment ships one: ephemeral storage, rebuilt on every start.
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-rest-v1-postgres
  labels:
    app.kubernetes.io/part-of: petclinic-rest-v1
type: Opaque
stringData:
  # Demo creds stay coolstore; DATABASE matches app name (R-83 P2 / O-DEVDBURL).
  POSTGRESQL_USER: coolstore
  POSTGRESQL_PASSWORD: coolstore
  POSTGRESQL_DATABASE: petclinic-rest-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-rest-v1-postgres
  labels:
    app.kubernetes.io/part-of: petclinic-rest-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-rest-v1-postgres
  template:
    metadata:
      labels:
        app: petclinic-rest-v1-postgres
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: petclinic-rest-v1-postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "coolstore", "-d", "petclinic-rest-v1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-rest-v1-postgres
  labels:
    app.kubernetes.io/part-of: petclinic-rest-v1
spec:
  selector:
    app: petclinic-rest-v1-postgres
  ports:
    - port: 5432
      targetPort: 5432


