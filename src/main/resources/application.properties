quarkus.http.port=8080
# preserve: server.servlet.context-path
server.servlet.context-path=/petclinic
# preserve servlet context-path via quarkus.rest.path (not http.root-path)
# quarkus.http.root-path would move / and /q/health and break ship acceptance + probes
quarkus.rest.path=/petclinic
quarkus.analytics.disabled=true

# Database configuration - PostgreSQL for production (k8s deployment)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/petclinic}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:coolstore}

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=import.sql
# dialect from db-kind
# quarkus.hibernate-orm.dialect=HSQL

# Security - simplified for demo (matches legacy petclinic.security.enable=false)
petclinic.security.enable=${petclinic.security.enable:false}

# LLM access is only through the MaaS gateway (see .opencode/skills/llm-integration.md).
# Uncomment when implementing an LLM-powered feature; the workspace injects
# the MAAS_* environment variables.
# quarkus.langchain4j.openai.base-url=${MAAS_API_BASE_URL}
# quarkus.langchain4j.openai.api-key=${MAAS_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL_NAME}
# quarkus.langchain4j.openai.chat-model.temperature=0.1
# quarkus.langchain4j.openai.timeout=60s

# JaCoCo configuration is handled via pom.xml properties and Maven plugin
