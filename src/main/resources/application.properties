quarkus.http.port=8080
quarkus.http.root-path=/petclinic
quarkus.analytics.disabled=true

# Database configuration - HSQLDB (default, matches legacy spring.profiles.active=hsqldb)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${jdbc.url:jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1}
quarkus.datasource.username=${jdbc.username:sa}
quarkus.datasource.password=${jdbc.password:}

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=NoSuchFile
# dialect from db-kind
# quarkus.hibernate-orm.dialect=HSQL

# Security - simplified for demo (matches legacy petclinic.security.enable=false)
petclinic.security.enable=${petclinic.security.enable:false}

# LLM access is only through the MaaS gateway (see .opencode/skills/llm-integration.md).
# Uncomment when implementing an LLM-powered feature; the workspace injects
# the MAAS_* environment variables.
# quarkus.langchain4j.openai.base-url=${MAAS_API_BASE_URL}
# quarkus.langchain4j.openai.api-key=${MAAS_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL_NAME}
# quarkus.langchain4j.openai.chat-model.temperature=0.1
# quarkus.langchain4j.openai.timeout=60s

# O-QJACOCO: merge QuarkusTest coverage into shared exec for maven report
quarkus.jacoco.data-file=target/jacoco-quarkus.exec
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report=true
quarkus.jacoco.report-location=target/jacoco-report
